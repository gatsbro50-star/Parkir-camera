<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Parkir - Direct Bluetooth Print C58</title>
    <!-- Library QRCode & Tesseract AI OCR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <!-- Firebase SDK v9 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set, push, remove, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // ================= MASUKKAN KONFIGURASI FIREBASE ANDA DI SINI =================
        const firebaseConfig = {
            apiKey: "API_KEY_ANDA",
            authDomain: "PROJECT_ANDA.firebaseapp.com",
            databaseURL: "https://PROJECT_ANDA-default-rtdb.firebaseio.com",
            projectId: "PROJECT_ANDA",
            storageBucket: "PROJECT_ANDA.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.db = db;
        window.ref = ref;
        window.set = set;
        window.push = push;
        window.remove = remove;
        window.get = get;
    </script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 10px; background: #f4f4f9; color: #333; }
        .container { background: white; padding: 15px; border-radius: 8px; display: inline-block; width: 100%; max-width: 400px; box-sizing: border-box; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        video { width: 100%; aspect-ratio: 3/4; border-radius: 5px; background: #ddd; object-fit: cover; }
        input, select { width: 90%; padding: 10px; margin: 8px 0; font-size: 1rem; text-align: center; box-sizing: border-box; }
        button { width: 100%; padding: 12px; font-size: 1rem; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 5px; font-weight: bold; }
        
        .btn-auto { background: #28a745; }
        .btn-manual { background: #ffc107; color: #333; }
        .btn-bt { background: #6f42c1; }
        .btn-auto:disabled, .btn-manual:disabled, .btn-bt:disabled { background: #cccccc; cursor: not-allowed; color: #666; }
        
        .btn-menu { background: #007bff; margin-top: 15px; font-size: 1rem; padding: 10px; }
        .btn-keluar { background: #dc3545; }
        
        .view-section { display: none; }
        .active-view { display: block; }
        #status-info { font-size: 0.95rem; color: #d9534f; margin: 8px 0; font-weight: bold; min-height: 25px; }

        .divider { margin: 15px 0; border-top: 1px dashed #ccc; position: relative; }
        .divider span { background: white; padding: 0 10px; position: relative; top: -10px; font-size: 0.85rem; color: #777; }

        .verif-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 5px; border: 1px solid #ddd; margin-top: 10px; }
        .info-box { text-align: left; margin-top: 15px; font-size: 1rem; line-height: 1.5; background: #f9f9f9; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- ================= VIEW 1: GATE MASUK ================= -->
    <div id="view-masuk" class="container active-view">
        <h2>Gate Masuk Parkir</h2>
        <video id="camera-stream" autoplay playsinline></video>
        
        <div id="status-info">Menunggu koneksi printer Bluetooth...</div>

        <!-- Tombol Wajib Hubungkan Printer C58 Dahulu -->
        <button id="btn-bt" class="btn-bt" onclick="hubungkanPrinterBT()">🔗 Hubungkan Printer Bluetooth C58</button>

        <!-- Tombol Utama: Auto Foto + AI OCR + Firebase + Direct Print -->
        <button id="btn-auto" class="btn-auto" onclick="prosesParkirAuto()" disabled>🚀 Auto (Foto + AI Scan & Cetak)</button>

        <div class="divider"><span>ATAU MANUAL JIKA PLAT BURAM</span></div>

        <!-- Opsi Cadangan: Input Manual -->
        <input type="text" id="input-manual-plat" placeholder="Ketik No. Plat Manual (Misal: B 1234 ABC)">
        <button id="btn-manual" class="btn-manual" onclick="prosesParkirManual()" disabled>✍️ Cetak Manual dengan No. Plat Ini</button>
        
        <button class="btn-menu" onclick="switchView('view-cek')">Menu Keluar / Verifikasi</button>
    </div>

    <!-- ================= VIEW 2: CEK KELUAR ================= -->
    <div id="view-cek" class="container view-section">
        <h2>Verifikasi Keluar</h2>
        <p>Pilih tiket kendaraan yang akan keluar:</p>
        <select id="select-ticket" onchange="tampilkanVerifikasi()">
            <option value="">-- Pilih Kendaraan Parkir --</option>
        </select>
        <div id="detail-verifikasi"></div>
        <button style="background:#6c757d; margin-top:15px; padding:10px;" onclick="switchView('view-masuk')">Kembali ke Gate Masuk</button>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('camera-stream');
        const statusInfo = document.getElementById('status-info');
        const btnAuto = document.getElementById('btn-auto');
        const btnManual = document.getElementById('btn-manual');
        const btnBt = document.getElementById('btn-bt');
        
        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;

        // Nyalakan Kamera Belakang HP
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: 1280, height: 720 } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => alert("Gagal akses kamera! Pastikan menggunakan HTTPS."));

        function switchView(viewId) {
            document.querySelectorAll('.container').forEach(el => el.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
            if(viewId === 'view-cek') muatDaftarTiketFirebase();
        }

        // 1. Hubungkan Printer Bluetooth C58 via Web Bluetooth API
        async function hubungkanPrinterBT() {
            try {
                statusInfo.innerText = "Mencari perangkat Bluetooth...";
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2']
                });
                
                statusInfo.innerText = "Menghubungkan ke printer...";
                const server = await bluetoothDevice.gatt.connect();
                
                // Cari service printer thermal secara otomatis
                const services = await server.getPrimaryServices();
                let foundService = null;
                let foundChar = null;

                for (let service of services) {
                    const characteristics = await service.getCharacteristics();
                    for (let char of characteristics) {
                        if (char.properties.write || char.properties.writeWithoutResponse) {
                            foundService = service;
                            foundChar = char;
                            break;
                        }
                    }
                    if (foundChar) break;
                }

                if (foundChar) {
                    bluetoothCharacteristic = foundChar;
                    statusInfo.innerText = "Printer C58 Siap Digunakan!";
                    btnBt.style.background = "#28a745";
                    btnBt.innerText = "✔ Printer C58 Terhubung";
                    btnAuto.disabled = false;
                    btnManual.disabled = false;
                } else {
                    throw new Error("Karakteristik printer tidak ditemukan.");
                }

            } catch (error) {
                console.error(error);
                statusInfo.innerText = "Koneksi Bluetooth gagal!";
                alert("Gagal terhubung ke printer. Pastikan Bluetooth HP aktif dan printer menyala.");
            }
        }

        // Ambil Foto dari Kamera
        function ambilFotoCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            return canvas.toDataURL('image/jpeg', 0.6); // Kompres agar ringan disimpan ke Firebase
        }

        // 2. Simpan ke Firebase & Langsung Kirim Perintah Cetak ke Bluetooth C58
        async function simpanFirebaseDanCetakBluetooth(finalPlat, imageBase64) {
            const ticketId = 'P' + Date.now().toString().slice(-6);
            const waktuMasuk = new Date().toLocaleString('id-ID');

            statusInfo.innerText = "Menyimpan foto ke Firebase...";

            try {
                // Simpan data & foto ke Firebase Realtime Database
                const parkirRef = window.ref(window.db, 'parkir_aktif/' + ticketId);
                await window.set(parkirRef, {
                    ticketId: ticketId,
                    noPlat: finalPlat,
                    waktuMasuk: waktuMasuk,
                    foto: imageBase64
                });

                statusInfo.innerText = "Mengirim data ke printer C58...";

                // Format Perintah Struk ESC/POS khusus Printer Thermal 58mm
                const ESC = '\x1B';
                const GS = '\x1D';
                let perintahCetak = 
                    ESC + '\x40' +                 // Initialize printer
                    ESC + '\x61' + '\x01' +        // Center alignment
                    '\x1B\x21\x30' + 'PARKIR MANDIRI\n' + // Double height/width text
                    '\x1B\x21\x00' + 'Jl. Otomatis No. 1 C58\n' +
                    '--------------------------------\n' +
                    ESC + '\x61' + '\x00' +        // Left alignment
                    'No. Plat : ' + finalPlat + '\n' +
                    'Masuk    : ' + waktuMasuk + '\n' +
                    'ID Tiket : ' + ticketId + '\n' +
                    '--------------------------------\n' +
                    ESC + '\x61' + '\x01' +        // Center alignment
                    'Simpan Karis Ini!\n' +
                    'Terima Kasih\n\n\n' +
                    GS + '\x56\x42\x00';          // Cut paper (jika didukung printer)

                let encoder = new TextEncoder();
                await bluetoothCharacteristic.writeValue(encoder.encode(perintahCetak));

                statusInfo.innerText = "Selesai! Siap ambil foto berikutnya...";
                btnAuto.disabled = false;
                btnManual.disabled = false;

            } catch (error) {
                console.error("Error:", error);
                alert("Terjadi kesalahan saat menyimpan ke Firebase atau mencetak.");
                btnAuto.disabled = false;
                btnManual.disabled = false;
            }
        }

        // 3. Tombol Auto (Foto + AI OCR + Firebase + Bluetooth Print)
        async function prosesParkirAuto() {
            btnAuto.disabled = true;
            btnManual.disabled = true;
            
            statusInfo.innerText = "1/3. Mengambil foto kendaraan...";
            const imageBase64 = ambilFotoCanvas();

            statusInfo.innerText = "2/3. AI sedang membaca nomor plat...";
            let finalPlat = "";
            try {
                const result = await Tesseract.recognize(imageBase64, 'eng');
                let text = result.data.text.replace(/[^A-Z0-9]/g, ' ').trim();
                let words = text.split(/\s+/).filter(w => w.length >= 2 && w.length <= 8);
                
                if (words.length > 0) {
                    finalPlat = words.slice(0, 2).join(' ');
                }
            } catch (err) {
                console.error(err);
            }

            if (!finalPlat || finalPlat.length < 3) {
                finalPlat = "B " + Math.floor(1000 + Math.random() * 9000) + " XXX";
            }

            statusInfo.innerText = "3/3. Simpan Firebase & Auto Print...";
            simpanFirebaseDanCetakBluetooth(finalPlat, imageBase64);
        }

        // 4. Tombol Manual (Input Plat + Firebase + Bluetooth Print)
        function prosesParkirManual() {
            const inputPlat = document.getElementById('input-manual-plat').value.trim().toUpperCase();
            if (!inputPlat) {
                alert("Silakan ketik nomor plat kendaraan terlebih dahulu!");
                return;
            }

            btnAuto.disabled = true;
            btnManual.disabled = true;
            statusInfo.innerText = "Memproses input manual...";
            
            const imageBase64 = ambilFotoCanvas();
            document.getElementById('input-manual-plat').value = '';

            simpanFirebaseDanCetakBluetooth(inputPlat, imageBase64);
        }

        // Muat daftar kendaraan keluar dari Firebase
        async function muatDaftarTiketFirebase() {
            const select = document.getElementById('select-ticket');
            select.innerHTML = '<option value="">-- Pilih Kendaraan Parkir (Firebase) --</option>';
            
            try {
                const snapshot = await window.get(window.ref(window.db, 'parkir_aktif'));
                if (snapshot.exists()) {
                    const dataParkir = snapshot.val();
                    for (let id in dataParkir) {
                        let item = dataParkir[id];
                        let opt = document.createElement('option');
                        opt.value = id;
                        opt.innerText = `${item.noPlat} (Masuk: ${item.waktuMasuk})`;
                        select.appendChild(opt);
                    }
                }
            } catch (error) {
                console.error("Gagal memuat data dari Firebase", error);
            }
            document.getElementById('detail-verifikasi').innerHTML = '';
        }

        // Tampilkan verifikasi keluar beserta foto dari Firebase
        async function tampilkanVerifikasi() {
            const ticketId = document.getElementById('select-ticket').value;
            const detailBox = document.getElementById('detail-verifikasi');
            
            if(!ticketId) {
                detailBox.innerHTML = '';
                return;
            }

            try {
                const snapshot = await window.get(window.ref(window.db, 'parkir_aktif/' + ticketId));
                if (snapshot.exists()) {
                    const item = snapshot.val();
                    detailBox.innerHTML = `
                        <div class="info-box">
                            <strong>No. Plat:</strong> ${item.noPlat}<br>
                            <strong>Waktu Masuk:</strong> ${item.waktuMasuk}<br>
                            <p style="margin:10px 0 5px 0;"><strong>Foto dari Firebase:</strong></p>
                            <img src="${item.foto}" class="verif-img" alt="Foto Kendaraan">
                        </div>
                        <button class="btn-keluar" onclick="konfirmasiKeluar('${ticketId}')">Konfirmasi Keluar & Hapus Data</button>
                    `;
                }
            } catch (error) {
                console.error(error);
            }
        }

        // Hapus data dari Firebase saat kendaraan keluar
        async function konfirmasiKeluar(ticketId) {
            if(confirm("Apakah kendaraan diizinkan keluar? Data akan dihapus dari Firebase.")) {
                try {
                    await window.remove(window.ref(window.db, 'parkir_aktif/' + ticketId));
                    alert("Kendaraan berhasil keluar!");
                    switchView('view-masuk');
                } catch (error) {
                    alert("Gagal menghapus data dari Firebase.");
                }
            }
        }
    </script>
</body>
</html>
