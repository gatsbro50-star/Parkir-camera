<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Parkir - Auto & Manual Input</title>
    <!-- Library QRCode & Tesseract AI OCR -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 10px; background: #f4f4f9; }
        .container { background: white; padding: 15px; border-radius: 8px; display: inline-block; width: 100%; max-width: 400px; box-sizing: border-box; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        video { width: 100%; aspect-ratio: 3/4; border-radius: 5px; background: #ddd; object-fit: cover; }
        input, select { width: 90%; padding: 10px; margin: 8px 0; font-size: 1rem; text-align: center; box-sizing: border-box; }
        button { width: 100%; padding: 12px; font-size: 1rem; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 5px; font-weight: bold; }
        
        .btn-auto { background: #28a745; }
        .btn-manual { background: #ffc107; color: #333; }
        .btn-auto:disabled, .btn-manual:disabled { background: #cccccc; cursor: not-allowed; color: #666; }
        
        .btn-menu { background: #007bff; margin-top: 15px; font-size: 1rem; padding: 10px; }
        .btn-keluar { background: #dc3545; }
        
        .view-section { display: none; }
        .active-view { display: block; }
        #status-info { font-size: 0.9rem; color: #d9534f; margin: 5px 0; font-weight: bold; min-height: 20px; }

        .divider { margin: 15px 0; border-top: 1px dashed #ccc; position: relative; }
        .divider span { background: white; padding: 0 10px; position: relative; top: -10px; font-size: 0.85rem; color: #777; }

        /* Styling Struk Thermal (Hanya Text & QR Code) */
        @media print {
            body { margin: 0; background: white; }
            .no-print { display: none !important; }
            .struk {
                display: block !important;
                width: 58mm;
                font-family: 'Courier New', Courier, monospace;
                font-size: 11px;
                text-align: left;
                padding: 5px;
            }
            #print-qrcode { margin: 10px auto; display: flex; justify-content: center; }
            #print-qrcode img { width: 100px; height: 100px; }
        }
        .struk { display: none; }
        
        .verif-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 5px; border: 1px solid #ddd; margin-top: 10px; }
        .info-box { text-align: left; margin-top: 15px; font-size: 1rem; line-height: 1.5; background: #f9f9f9; padding: 10px; border-radius: 5px; }
    </style>
</head>
<body>

    <!-- ================= VIEW 1: GATE MASUK ================= -->
    <div id="view-masuk" class="container active-view no-print">
        <h2>Gate Masuk Parkir</h2>
        <video id="camera-stream" autoplay playsinline></video>
        
        <div id="status-info">Siap ambil foto...</div>

        <!-- Opsi 1: Full Auto (Foto -> AI OCR -> Simpan -> Print) -->
        <button id="btn-auto" class="btn-auto" onclick="prosesParkirAuto()">🚀 Auto (Foto + AI Scan & Cetak)</button>

        <div class="divider"><span>ATAU JIKA PLAT BURAM / TIDAK TERBACA</span></div>

        <!-- Opsi 2: Input Manual Jika OCR Gagal -->
        <input type="text" id="input-manual-plat" placeholder="Ketik No. Plat Manual (Misal: B 1234 ABC)">
        <button id="btn-manual" class="btn-manual" onclick="prosesParkirManual()">✍️ Cetak Manual dengan No. Plat Ini</button>
        
        <button class="btn-menu" onclick="switchView('view-cek')">Menu Keluar / Verifikasi</button>
    </div>

    <!-- ================= VIEW 2: CEK KELUAR ================= -->
    <div id="view-cek" class="container view-section no-print">
        <h2>Verifikasi Keluar</h2>
        <p>Pilih tiket kendaraan yang akan keluar:</p>
        <select id="select-ticket" onchange="tampilkanVerifikasi()">
            <option value="">-- Pilih Kendaraan Parkir --</option>
        </select>
        <div id="detail-verifikasi"></div>
        <button style="background:#6c757d; margin-top:15px; padding:10px;" onclick="switchView('view-masuk')">Kembali ke Gate Masuk</button>
    </div>

    <canvas id="canvas" style="display:none;"></canvas>

    <!-- ================= STRUK THERMAL (DICETAK) ================= -->
    <div id="struk-area" class="struk">
        <center>
            <strong>PARKIR MANDIRI</strong><br>
            Jl. Otomatis No. 1<br>
            --------------------------------
        </center>
        <strong>No. Plat :</strong> <span id="s-plat"></span><br>
        <strong>Masuk    :</strong> <span id="s-waktu"></span><br>
        --------------------------------<br>
        <center>
            <div id="print-qrcode"></div>
            Simpan karcis ini!<br>
            Terima Kasih
        </center>
    </div>

    <script>
        const video = document.getElementById('camera-stream');
        const statusInfo = document.getElementById('status-info');
        const btnAuto = document.getElementById('btn-auto');
        const btnManual = document.getElementById('btn-manual');

        // Nyalakan Kamera Belakang HP
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: 1280, height: 720 } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => alert("Gagal akses kamera! Pastikan menggunakan HTTPS."));

        function switchView(viewId) {
            document.querySelectorAll('.container').forEach(el => el.classList.remove('active-view'));
            document.getElementById(viewId).classList.add('active-view');
            if(viewId === 'view-cek') muatDaftarTiket();
        }

        // Ambil Foto dari Kamera (Helper Bersama)
        function ambilFotoCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            return canvas.toDataURL('image/jpeg');
        }

        // Simpan Data & Cetak Struk (Helper Bersama)
        function finalisasiDanCetak(finalPlat, imageBase64) {
            const ticketId = 'P' + Date.now().toString().slice(-6);
            const waktuMasuk = new Date().toLocaleString('id-ID');

            // Simpan ke memori browser (localStorage)
            const dataParkir = JSON.parse(localStorage.getItem('parkir_aktif') || '{}');
            dataParkir[ticketId] = {
                ticketId: ticketId,
                noPlat: finalPlat,
                waktuMasuk: waktuMasuk,
                foto: imageBase64
            };
            localStorage.setItem('parkir_aktif', JSON.stringify(dataParkir));

            // Isi template struk
            document.getElementById('s-plat').innerText = finalPlat;
            document.getElementById('s-waktu').innerText = waktuMasuk;
            
            const qrContainer = document.getElementById('print-qrcode');
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, { text: ticketId, width: 90, height: 90 });

            statusInfo.innerText = "Mencetak karcis...";
            setTimeout(() => {
                window.print();
                statusInfo.innerText = "Siap ambil foto...";
                btnAuto.disabled = false;
                btnManual.disabled = false;
            }, 500);
        }

        // 1. Tombol Auto (AI OCR)
        async function prosesParkirAuto() {
            btnAuto.disabled = true;
            btnManual.disabled = true;
            
            statusInfo.innerText = "1/3. Mengambil foto...";
            const imageBase64 = ambilFotoCanvas();

            statusInfo.innerText = "2/3. AI membaca nomor plat...";
            let finalPlat = "";
            try {
                const result = await Tesseract.recognize(imageBase64, 'eng');
                let text = result.data.text.replace(/[^A-Z0-9]/g, ' ').trim();
                let words = text.split(/\s+/).filter(w => w.length >= 2 && w.length <= 8);
                
                if (words.length > 0) {
                    finalPlat = words.slice(0, 2).join(' ');
                }
            } catch (err) {
                console.error(err);
            }

            // Jika AI gagal membaca/buram, gunakan fallback otomatis
            if (!finalPlat || finalPlat.length < 3) {
                finalPlat = "B " + Math.floor(1000 + Math.random() * 9000) + " XXX";
            }

            finalisasiDanCetak(finalPlat, imageBase64);
        }

        // 2. Tombol Manual (Ketik Sendiri jika Plat Buram/AI Gagal)
        function prosesParkirManual() {
            const inputPlat = document.getElementById('input-manual-plat').value.trim().toUpperCase();
            if (!inputPlat) {
                alert("Silakan ketik nomor plat kendaraan terlebih dahulu pada kolom yang disediakan!");
                return;
            }

            btnAuto.disabled = true;
            btnManual.disabled = true;
            statusInfo.innerText = "Mengambil foto untuk data manual...";
            
            const imageBase64 = ambilFotoCanvas();
            document.getElementById('input-manual-plat').value = ''; // Reset input

            finalisasiDanCetak(inputPlat, imageBase64);
        }

        // Muat daftar tiket untuk menu keluar
        function muatDaftarTiket() {
            const select = document.getElementById('select-ticket');
            select.innerHTML = '<option value="">-- Pilih Kendaraan Parkir --</option>';
            
            const dataParkir = JSON.parse(localStorage.getItem('parkir_aktif') || '{}');
            for (let id in dataParkir) {
                let item = dataParkir[id];
                let opt = document.createElement('option');
                opt.value = id;
                opt.innerText = `${item.noPlat} (Masuk: ${item.waktuMasuk})`;
                select.appendChild(opt);
            }
            document.getElementById('detail-verifikasi').innerHTML = '';
        }

        // Tampilkan foto asli saat verifikasi keluar
        function tampilkanVerifikasi() {
            const ticketId = document.getElementById('select-ticket').value;
            const detailBox = document.getElementById('detail-verifikasi');
            
            if(!ticketId) {
                detailBox.innerHTML = '';
                return;
            }

            const dataParkir = JSON.parse(localStorage.getItem('parkir_aktif') || '{}');
            const item = dataParkir[ticketId];

            if(item) {
                detailBox.innerHTML = `
                    <div class="info-box">
                        <strong>No. Plat:</strong> ${item.noPlat}<br>
                        <strong>Waktu Masuk:</strong> ${item.waktuMasuk}<br>
                        <p style="margin:10px 0 5px 0;"><strong>Foto Pengendara & Motor:</strong></p>
                        <img src="${item.foto}" class="verif-img" alt="Foto Asli">
                    </div>
                    <button class="btn-keluar" onclick="konfirmasiKeluar('${ticketId}')">Konfirmasi Keluar & Hapus Data</button>
                `;
            }
        }

        function konfirmasiKeluar(ticketId) {
            if(confirm("Apakah kendaraan diizinkan keluar?")) {
                let dataParkir = JSON.parse(localStorage.getItem('parkir_aktif') || '{}');
                delete dataParkir[ticketId];
                localStorage.setItem('parkir_aktif', JSON.stringify(dataParkir));
                alert("Kendaraan berhasil keluar!");
                switchView('view-masuk');
            }
        }
    </script>
</body>
</html>
