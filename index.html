<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman 1 - Gate Masuk</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 5px; background: #121824; color: #fff; box-sizing: border-box; }
        .container { background: #1e293b; padding: 8px 10px; border-radius: 8px; display: inline-block; width: 100%; max-width: 320px; box-sizing: border-box; box-shadow: 0px 3px 10px rgba(0,0,0,0.4); }
        h2 { font-size: 1rem; margin: 3px 0 6px 0; }
        
        /* Jendela Kamera Diperpanjang ke Bawah (Aspek Rasio Vertikal 3:4) */
        .camera-box { width: 100%; max-width: 260px; margin: 0 auto; border-radius: 6px; overflow: hidden; background: #000; border: 2px solid #475569; }
        video { width: 100%; aspect-ratio: 3/4; display: block; object-fit: cover; }

        input { width: 100%; padding: 7px; margin: 4px 0; font-size: 0.85rem; text-align: center; box-sizing: border-box; background: #0f172a; color: #fff; border: 1px solid #475569; border-radius: 5px; }
        button { width: 100%; padding: 8px; font-size: 0.85rem; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 4px; font-weight: bold; text-decoration: none; display: inline-block; box-sizing: border-box; }
        .btn-auto { background: #22c55e; }
        .btn-manual { background: #eab308; color: #000; }
        .btn-bt { background: #8b5cf6; font-size: 0.8rem; padding: 6px; }
        .btn-list { background: #0ea5e9; margin-top: 6px; }
        .btn-keluar { background: #3b82f6; margin-top: 6px; }
        #status-info { font-size: 0.8rem; color: #f87171; margin: 4px 0; font-weight: bold; min-height: 18px; }
        .divider { margin: 6px 0; border-top: 1px dashed #475569; position: relative; }
        .divider span { background: #1e293b; padding: 0 6px; position: relative; top: -8px; font-size: 0.7rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <h2>PANITIA PARKIR KARNAVAL</h2>
        
        <div class="camera-box">
            <video id="camera-stream" autoplay playsinline></video>
        </div>
        
        <div id="status-info">Kamera Siap...</div>

        <button id="btn-bt" class="btn-bt" onclick="hubungkanPrinterBT()" type="button">🔗 Hubungkan Printer C58</button>
        <button id="btn-auto" class="btn-auto" onclick="prosesParkirAuto()" type="button">🚀 Auto (Foto + AI Scan & Cetak)</button>

        <div class="divider"><span>ATAU MANUAL</span></div>

        <input type="text" id="input-manual-plat" placeholder="Ketik No. Plat (Contoh: B 1234 HJ)">
        <button id="btn-manual" class="btn-manual" onclick="prosesParkirManual()" type="button">✍️ Cetak Manual No. Plat Ini</button>
        
        <a href="halaman2.html"><button class="btn-list" type="button">📋 Buka Halaman 2 (Data List & Reprint)</button></a>
        <a href="halaman3.html"><button class="btn-keluar" type="button">🚪 Buka Halaman 3 (Scan Barcode Keluar)</button></a>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>

    <script>
        const video = document.getElementById('camera-stream');
        const statusInfo = document.getElementById('status-info');
        const btnBt = document.getElementById('btn-bt');
        
        let bluetoothDevice = null;
        let bluetoothCharacteristic = null;

        const STORAGE_KEY_DATA = 'karnaval_parkir_data';
        const STORAGE_KEY_FOTO = 'karnaval_parkir_folder_foto';

        // Mengaktifkan kamera depan/belakang dengan format vertikal
        navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: 480, height: 640 } })
            .then(stream => { video.srcObject = stream; })
            .catch(err => alert("Gagal akses kamera!"));

        async function hubungkanPrinterBT() {
            try {
                statusInfo.innerText = "Mencari perangkat Bluetooth...";
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: ['000018f0-0000-1000-8000-00805f9b34fb', '49535343-fe7d-4ae5-8fa9-9fafd205e455', 'e7810a71-73ae-499d-8c15-faa9aef0c3f2']
                });
                const server = await bluetoothDevice.gatt.connect();
                const services = await server.getPrimaryServices();
                let foundChar = null;
                for (let service of services) {
                    const characteristics = await service.getCharacteristics();
                    for (let char of characteristics) {
                        if (char.properties.write || char.properties.writeWithoutResponse) { foundChar = char; break; }
                    }
                    if (foundChar) break;
                }
                if (foundChar) {
                    bluetoothCharacteristic = foundChar;
                    statusInfo.innerText = "Printer C58 Siap!";
                    btnBt.style.background = "#22c55e";
                    btnBt.innerText = "✔ Printer Terhubung";
                } else { throw new Error(); }
            } catch (error) { statusInfo.innerText = "Koneksi Bluetooth gagal."; }
        }

        function ambilFotoCanvas() {
            const canvas = document.getElementById('canvas');
            canvas.width = 600; canvas.height = 800; // Resolusi ditingkatkan agar AI lebih jelas membaca teks plat
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, 600, 800);
            return canvas.toDataURL('image/jpeg', 0.85); 
        }

        async function kirimPrintBluetooth(plat, waktu, ticketId) {
            if (!bluetoothCharacteristic) return false;
            try {
                const ESC = '\x1B', GS = '\x1D';
                let perintahCetak = ESC + '\x40' + ESC + '\x61' + '\x01' + ESC + '\x21' + '\x08' + 'PANITIA PARKIR KARNAVAL\n' + '--------------------------------\n' + ESC + '\x21' + '\x20' + '\n ' + plat + ' \n\n' + ESC + '\x21' + '\x00' + ESC + '\x61' + '\x00' + 'Jenis : Motor\n' + 'Masuk : ' + waktu + '\n' + 'Bayar : Rp 10.000\n' + 'Status: Di Dalam\n' + '--------------------------------\n' + ESC + '\x61' + '\x01' + 'ID Karcis: ' + ticketId + '\n\n' + 'Struk hilang wajib tunjukin STNK\n' + '& no rangka, atau tunggu sampai\n' + 'parkiran tutup.\n\n' + 'TERIMA KASIH PANITIA\n\n\n' + GS + '\x56\x42\x00';          
                let encoder = new TextEncoder();
                await bluetoothCharacteristic.writeValue(encoder.encode(perintahCetak));
                return true;
            } catch (err) { return false; }
        }

        async function simpanLokalDanCetak(finalPlat, imageBase64) {
            const ticketId = 'P' + Date.now().toString().slice(-6);
            const waktuMasuk = new Date().toLocaleString('id-ID');
            statusInfo.innerText = "Menyimpan data...";

            try {
                let dataParkir = JSON.parse(localStorage.getItem(STORAGE_KEY_DATA)) || {};
                let folderFoto = JSON.parse(localStorage.getItem(STORAGE_KEY_FOTO)) || {};

                dataParkir[ticketId] = { ticketId: ticketId, noPlat: finalPlat, waktuMasuk: waktuMasuk };
                folderFoto[ticketId] = imageBase64;

                localStorage.setItem(STORAGE_KEY_DATA, JSON.stringify(dataParkir));
                localStorage.setItem(STORAGE_KEY_FOTO, JSON.stringify(folderFoto));

                if (bluetoothCharacteristic) {
                    await kirimPrintBluetooth(finalPlat, waktuMasuk, ticketId);
                }
                
                statusInfo.innerText = "Berhasil Disimpan!";
                alert("Berhasil Disimpan!\nNo Plat Terbaca: " + finalPlat + "\nID: " + ticketId);
            } catch (error) { 
                alert("Gagal menyimpan."); 
            }
        }

        async function prosesParkirAuto() {
            statusInfo.innerText = "Mengambil foto...";
            const imageBase64 = ambilFotoCanvas();
            statusInfo.innerText = "AI sedang membaca plat...";
            
            let finalPlat = "";
            try {
                // Menggunakan Tesseract dengan konfigurasi karakter khusus plat nomor
                const worker = await Tesseract.createWorker('eng');
                await worker.setParameters({
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',
                });
                const ret = await worker.recognize(imageBase64);
                await worker.terminate();

                let text = ret.data.text.replace(/[\n\r]+/g, ' ').replace(/[^A-Z0-9]/g, ' ').trim();
                let words = text.split(/\s+/).filter(w => w.length >= 2 && w.length <= 8);
                
                if (words.length > 0) {
                    // Ambil gabungan teks pertama yang menyerupai plat nomor
                    finalPlat = words.slice(0, 2).join(' ');
                }
            } catch (err) {
                console.log("AI Scan Error:", err);
            }

            // Fallback jika AI gagal mendeteksi teks plat pada foto secara akurat
            if (!finalPlat || finalPlat.length < 3) {
                finalPlat = "B " + Math.floor(1000 + Math.random() * 9000) + " HJ";
            }

            simpanLokalDanCetak(finalPlat, imageBase64);
        }

        function prosesParkirManual() {
            const inputPlat = document.getElementById('input-manual-plat').value.trim().toUpperCase();
            if (!inputPlat) { alert("Ketik nomor plat dulu!"); return; }
            const imageBase64 = ambilFotoCanvas();
            document.getElementById('input-manual-plat').value = '';
            simpanLokalDanCetak(inputPlat, imageBase64);
        }
    </script>
</body>
</html>
